<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="LD76 Investment Radar - Research newly discovered investment websites and analyze scam indicators."
  >

  <meta name="theme-color" content="#0b1220">

  <link rel="manifest" href="/manifest.json">

  <title>LD76 Investment Radar</title>
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-title">LD76 INVESTMENT RADAR</div>
        <div class="brand-subtitle">
          Recently Registered Sites
        </div>
      </div>

      <button
        id="settingsButton"
        class="icon-button"
        type="button"
        aria-label="Open settings"
      >
        ⚙️
      </button>
    </header>

    <main class="main-content">

      <section class="scan-panel">

        <div class="form-group">
          <label for="tldSelect">TLD</label>

          <select id="tldSelect">
            <option value=".top">.top</option>
            <option value=".xyz">.xyz</option>
            <option value=".io">.io</option>
            <option value=".online">.online</option>
            <option value=".site">.site</option>
            <option value=".shop">.shop</option>
            <option value=".live">.live</option>
            <option value=".vip">.vip</option>
          </select>
        </div>

        <div class="form-group">
          <label>Search Period</label>

          <div class="segmented-control">
            <button
              type="button"
              class="period-button active"
              data-period="24h"
            >
              24H
            </button>

            <button
              type="button"
              class="period-button"
              data-period="48h"
            >
              48H
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Payment Methods</label>

          <div class="checkbox-list">

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="paymentBank"
                value="bank"
                checked
              >
              <span>Bank</span>
            </label>

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="paymentEasypaisa"
                value="easypaisa"
                checked
              >
              <span>Easypaisa</span>
            </label>

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="paymentJazzcash"
                value="jazzcash"
                checked
              >
              <span>JazzCash</span>
            </label>

            <label class="checkbox-item">
              <input
                type="checkbox"
                id="paymentCrypto"
                value="crypto"
              >
              <span>Crypto</span>
            </label>

          </div>
        </div>

        <button
          id="findSitesButton"
          class="primary-button"
          type="button"
        >
          FIND NEW SITES
        </button>

      </section>

      <section
        id="progressSection"
        class="progress-section hidden"
        aria-live="polite"
      >
        <div class="section-title">
          Scan Progress
        </div>

        <div id="progressStatus" class="progress-status">
          Waiting...
        </div>

        <div class="progress-bar">
          <div
            id="progressBarFill"
            class="progress-bar-fill"
          ></div>
        </div>

        <div
          id="progressDetails"
          class="progress-details"
        ></div>
      </section>

      <section
        id="resultsSection"
        class="results-section"
      >
        <div class="section-header">
          <h2>Results</h2>

          <button
            id="refreshResultsButton"
            class="small-button"
            type="button"
          >
            Refresh
          </button>
        </div>

        <div
          id="resultsContainer"
          class="results-container"
        >
          <div class="empty-state">
            <div class="empty-icon">🔎</div>
            <h3>No scan results yet</h3>
            <p>
              Select your filters and tap
              <strong>FIND NEW SITES</strong>.
            </p>
          </div>
        </div>
      </section>

    </main>

    <nav class="bottom-nav" aria-label="Main navigation">

      <button
        type="button"
        class="nav-button active"
        data-view="home"
      >
        <span class="nav-icon">🔎</span>
        <span>Scan</span>
      </button>

      <button
        type="button"
        class="nav-button"
        data-view="history"
      >
        <span class="nav-icon">📋</span>
        <span>History</span>
      </button>

      <button
        type="button"
        class="nav-button"
        data-view="settings"
      >
        <span class="nav-icon">⚙️</span>
        <span>Settings</span>
      </button>

    </nav>

  </div>

  <script src="/app.js" defer></script>
</body>
</html>
